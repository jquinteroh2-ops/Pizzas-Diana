# Despliegue en Render (https://render.com) como «Blueprint».
# En Render: New → Blueprint → elegir este repositorio. Render lee este archivo y crea el servicio.
#
# Plan GRATIS. OJO: la base de datos es un archivo SQLite y en el plan gratis el disco NO es
# persistente: cuando el servicio se duerme (15 min sin visitas), se reinicia o se vuelve a
# desplegar, se borran los datos. Para guardar las ventas de verdad hace falta un disco
# (plan Starter + «disk») o una base de datos externa.
services:
  - type: web
    name: pizza-diana
    runtime: node
    plan: free
    # Con NODE_ENV=production npm no instala TypeScript ni Vite, que hacen falta para compilar.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/session
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
