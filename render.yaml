# Despliegue en Render (https://render.com) como «Blueprint».
# En Render: New → Blueprint → elegir este repositorio. Render lee este archivo y crea el servicio.
#
# IMPORTANTE: la base de datos es un archivo SQLite. Necesita un disco persistente (abajo, «disk»),
# y Render solo da discos en los planes pagos (Starter en adelante). En el plan gratis el disco se
# borra cada vez que el servicio se reinicia o se vuelve a desplegar: se perderían las ventas.
services:
  - type: web
    name: pizza-diana
    runtime: node
    plan: starter
    # Con NODE_ENV=production npm no instala TypeScript ni Vite, que hacen falta para compilar.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/session
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/pizza-diana.db
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
